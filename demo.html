<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dev</title>
<style>
  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 24px;
    min-height: 100vh;
    background: #0f1115;
    color: #8a8f9d;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }

  .card {
    width: 100%;
    max-width: 380px;
    background: #16181f;
    border: 1px solid #262932;
    border-radius: 16px;
    padding: 24px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  /* 1200x675 원본 비율 사진을 안 찌그러뜨리고 큼직하게 띄우는 프레임 */
  .neko-box {
    width: 100%;
    aspect-ratio: 1 / 1;
    border-radius: 12px;
    overflow: hidden;
    background: #20232d;
    border: 1px solid #2a2e3b;
  }

  .neko-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  .btn {
    margin-top: 20px;
    width: 100%;
    padding: 14px 0;
    background: #eef0f5;
    color: #0f1115;
    font-size: 14px;
    font-weight: 700;
    text-align: center;
    text-decoration: none;
    border-radius: 10px;
    transition: background 0.15s ease;
  }

  .btn:hover {
    background: #ffffff;
  }

  .label {
    margin-top: 14px;
    font-size: 12px;
    color: #525765;
  }
</style>
</head>
<body>

<div class="card">
  <div class="neko-box">
